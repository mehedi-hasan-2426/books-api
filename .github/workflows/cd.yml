name: CD — Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: books-api
  EC2_HOST: ${{ secrets.EC2_HOST }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: books-api-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - name: Build, tag and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./books-api
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            export JWT_SECRET=$(aws ssm get-parameter \
              --name /books-api/jwt-secret --with-decryption \
              --query Parameter.Value --output text)
            export DATABASE_PASSWORD=$(aws ssm get-parameter \
              --name /books-api/db-password --with-decryption \
              --query Parameter.Value --output text)
            export DATABASE_URL=$(aws ssm get-parameter \
              --name /books-api/database-url \
              --query Parameter.Value --output text)

            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS \
                --password-stdin ${{ steps.login-ecr.outputs.registry }}

            docker pull ${{ steps.build-image.outputs.image }}

            docker stop books-api 2>/dev/null || true
            docker rm books-api 2>/dev/null || true
            docker run -d --name books-api \
              --restart unless-stopped \
              -p 8080:8080 \
              -e JWT_SECRET="$JWT_SECRET" \
              -e DATABASE_URL="$DATABASE_URL" \
              -e DATABASE_USERNAME=books_user \
              -e DATABASE_PASSWORD="$DATABASE_PASSWORD" \
              -e SPRING_PROFILES_ACTIVE=prod \
              ${{ steps.build-image.outputs.image }}

            sleep 60
            curl -sf http://localhost:8080/api-docs || (docker logs books-api && exit 1)
