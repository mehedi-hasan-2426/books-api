spring:
  profiles:
    active: dev
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    open-in-view: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # Must be set via JWT_SECRET env var — minimum 32 bytes base64-encoded; no default intentionally
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 1800000        # 30 minutes
    refresh-expiration-ms: 604800000  # 7 days
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:8080,https://mehedi-hasan-2426.github.io,https://mehedi-hasan-2426.github.io"
